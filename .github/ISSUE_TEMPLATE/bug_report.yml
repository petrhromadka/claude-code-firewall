name: Bug report
description: Report a bug in cc-firewall (not a security issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (a call the policy should block gets through, a fail-open crash,
        secrets in the audit log) must not go here. Report them privately as described in
        SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The policy rule, the tool call (redact secrets), and the command you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cc-firewall version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python and Claude Code versions
      placeholder: "Windows 11, Python 3.14, Claude Code 2.x"
    validations:
      required: true
